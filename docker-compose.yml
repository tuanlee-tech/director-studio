# AI Audio Platform - Docker Compose Orchestration
# Usage:
#   Windows: .\launcher.ps1 up
#   Linux:   ./launcher.sh up
#   Manual:  docker compose --profile cpu up --build
#            docker compose --profile gpu up --build

x-common-env: &common-env
  HF_HOME: ${HF_HOME:-/home/app/.cache/huggingface}
  PYTHONUNBUFFERED: "1"

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  start_period: 180s
  retries: 3

networks:
  ai-audio-net:
    driver: bridge

volumes:
  huggingface_cache:
    name: ai-audio-hf-cache
  studio_data:
    name: ai-audio-studio-data

services:
  # ============================================================
  # VieNeu TTS - CPU (ONNX Runtime, no GPU required)
  # ============================================================
  vieneu-tts-cpu:
    profiles: ["cpu"]
    build:
      context: ./VieNeu-TTS
      dockerfile: docker/Dockerfile.cpu
    container_name: vieneu-tts
    environment:
      <<: *common-env
      GRADIO_SERVER_NAME: "0.0.0.0"
      GRADIO_SERVER_PORT: "7860"
      GRADIO_SHARE: "0"
      PORT: "7860"
    ports:
      - "${VIENEU_PORT:-7860}:7860"
    volumes:
      - huggingface_cache:/home/app/.cache/huggingface
    networks:
      - ai-audio-net
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:7860/', timeout=5).status == 200 else 1)"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G

  # ============================================================
  # VieNeu TTS - GPU (PyTorch + CUDA)
  # ============================================================
  vieneu-tts-gpu:
    profiles: ["gpu"]
    build:
      context: ./VieNeu-TTS
      dockerfile: docker/Dockerfile.gpu
      target: prod
    container_name: vieneu-tts
    command: ["python", "apps/gradio_main.py"]
    environment:
      <<: *common-env
      GRADIO_SERVER_NAME: "0.0.0.0"
      GRADIO_SERVER_PORT: "7860"
      GRADIO_SHARE: "0"
      PORT: "7860"
    ports:
      - "${VIENEU_PORT:-7860}:7860"
    volumes:
      - huggingface_cache:/home/app/.cache/huggingface
    networks:
      - ai-audio-net
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:7860/', timeout=5).status == 200 else 1)"]
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ============================================================
  # VieNeu TTS API - CPU (OpenAI-compatible endpoint)
  # ============================================================
  vieneu-api-cpu:
    profiles: ["cpu"]
    build:
      context: ./VieNeu-TTS
      dockerfile: docker/Dockerfile.cpu
    container_name: vieneu-tts-api
    command: ["python", "-m", "apps.openai_speech"]
    environment:
      <<: *common-env
      HOST: "0.0.0.0"
      PORT: "8000"
      VIENEU_BACKEND: onnx
      VIENEU_PRECISION: ${VIENEU_PRECISION:-fp32}
      VIENEU_QUEUE: ${VIENEU_QUEUE:-4}
      VIENEU_QUEUE_TIMEOUT: ${VIENEU_QUEUE_TIMEOUT:-10}
      VIENEU_API_KEY: ${VIENEU_API_KEY:-}
      VIENEU_WATERMARK: ${VIENEU_WATERMARK:-0}
    ports:
      - "${VIENEU_API_PORT:-8000}:8000"
    volumes:
      - huggingface_cache:/home/app/.cache/huggingface
    networks:
      - ai-audio-net
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
    restart: unless-stopped
    depends_on:
      vieneu-tts-cpu:
        condition: service_started

  # ============================================================
  # VieNeu TTS API - GPU (OpenAI-compatible endpoint)
  # ============================================================
  vieneu-api-gpu:
    profiles: ["gpu"]
    build:
      context: ./VieNeu-TTS
      dockerfile: docker/Dockerfile.gpu
      target: prod
    container_name: vieneu-tts-api
    command: ["python", "-m", "apps.openai_speech"]
    environment:
      <<: *common-env
      HOST: "0.0.0.0"
      PORT: "8000"
      VIENEU_MAX_STREAMS: ${VIENEU_MAX_STREAMS:-16}
      VIENEU_QUEUE: ${VIENEU_QUEUE:-16}
      VIENEU_QUEUE_TIMEOUT: ${VIENEU_QUEUE_TIMEOUT:-10}
      VIENEU_API_KEY: ${VIENEU_API_KEY:-}
      VIENEU_WATERMARK: ${VIENEU_WATERMARK:-0}
    ports:
      - "${VIENEU_API_PORT:-8000}:8000"
    volumes:
      - huggingface_cache:/home/app/.cache/huggingface
    networks:
      - ai-audio-net
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
    restart: unless-stopped
    depends_on:
      vieneu-tts-gpu:
        condition: service_started
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ============================================================
  # Studio UI - Management Dashboard (always runs)
  # ============================================================
  studio:
    profiles: ["cpu", "gpu"]
    build:
      context: ./studio
      dockerfile: Dockerfile
    container_name: ai-audio-studio
    environment:
      - VIENEU_TTS_URL=http://vieneu-tts:7860
      - VIENEU_API_URL=http://vieneu-tts-api:8000
      - PORT=3000
    ports:
      - "${STUDIO_PORT:-3000}:3000"
    volumes:
      - studio_data:/app/data
    networks:
      - ai-audio-net
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      start_period: 30s
    restart: unless-stopped
